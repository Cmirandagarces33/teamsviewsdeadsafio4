<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teams Views Deadsafio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{--bg:#120d0b;--panel:#1d1512;--text:#e8dccb;--muted:#8a7a6a;--blood:#a4231a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#2a1a14,var(--bg) 60%);color:var(--text);font-family:Georgia,serif;min-height:100vh}
header{text-align:center;padding:18px 10px 6px}
h1{margin:0;font-size:2rem;letter-spacing:.15em;text-transform:uppercase;color:var(--blood);text-shadow:0 0 12px #5a0f0a}
#status{color:var(--muted);font-size:.85rem;margin-top:4px}
main{display:flex;flex-wrap:wrap;gap:12px;padding:10px}
#chart{flex:1 1 640px;min-height:70vh;background:var(--panel);border:2px solid #3a2a22;border-radius:6px}
#legend{flex:0 0 240px;background:var(--panel);border:2px solid #3a2a22;border-radius:6px;padding:10px}
.row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #3a2a22;font-size:.95rem}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.row b{margin-left:auto}
circle{stroke:#000;stroke-width:1.5}
text{pointer-events:none;fill:#fff;text-anchor:middle;font-family:Georgia,serif;paint-order:stroke;stroke:#000;stroke-width:3px}
</style></head><body>
<header><h1>Teams Views · Deadsafio</h1><div id="status">cargando…</div></header>
<main><svg id="chart"></svg><div id="legend"></div></main>
<script>
const COLORS={"Team Mafia":"#c0392b","Team Minitas":"#ff6fb5","DOS PUNTOS UVE":"#3b82f6","Los hijos de perra":"#f97316","EromeTeam":"#8b5cf6","WEBONES CORP":"#22c55e","Aldo Erome Buscar":"#eab308","BonitasConRifles":"#06b6d4","Los Alcoholicos":"#a16207","Sin hermandad":"#9ca3af"};
const POLL=30000, demo=new URLSearchParams(location.search).has("demo");
let people=[], timer;
const svg=d3.select("#chart");

async function getViewers(){
  if(!demo){
    try{const r=await fetch("/api/viewers");if(!r.ok)throw 0;return {v:(await r.json()).viewers,demo:false};}catch(e){}
  }
  const v={};people.forEach(p=>v[p.slug]=Math.random()<.6?Math.floor(Math.random()**3*20000):0);
  return {v,demo:true};
}

function draw(){
  const box=svg.node().getBoundingClientRect(),W=box.width,H=box.height;
  const root=d3.pack().size([W,H]).padding(3)(d3.hierarchy({children:people}).sum(d=>Math.max(d.viewers,1)));
  const leaves=root.leaves();
  const g=svg.selectAll("g.b").data(leaves,d=>d.data.slug);
  const e=g.enter().append("g").attr("class","b").attr("transform",d=>`translate(${d.x},${d.y})`);
  e.append("circle").attr("r",0);e.append("text");e.append("title");
  const m=e.merge(g);
  m.transition().duration(900).attr("transform",d=>`translate(${d.x},${d.y})`);
  m.select("circle").attr("fill",d=>COLORS[d.data.team]||"#888").attr("opacity",d=>d.data.viewers?0.92:0.25)
    .transition().duration(900).attr("r",d=>d.r);
  m.select("title").text(d=>`${d.data.name} (${d.data.team}): ${d.data.viewers.toLocaleString()} espectadores`);
  m.select("text").attr("dy",".3em").style("font-size",d=>Math.max(8,Math.min(d.r/3.2,18))+"px")
    .text(d=>d.r>16?(d.r>30?d.data.name+"\n":"")+"":"").each(function(d){
      const t=d3.select(this);t.text(null);
      if(d.r>18){t.append("tspan").attr("x",0).attr("dy",d.r>28?"-.2em":".3em").text(d.data.name.slice(0,Math.floor(d.r/4.5)));}
      if(d.r>28&&d.data.viewers)t.append("tspan").attr("x",0).attr("dy","1.1em").text(d.data.viewers.toLocaleString());
    });
  g.exit().remove();
  const tot={};people.forEach(p=>tot[p.team]=(tot[p.team]||0)+p.viewers);
  document.getElementById("legend").innerHTML="<b>Total por team</b>"+Object.entries(tot).sort((a,b)=>b[1]-a[1])
    .map(([t,n])=>`<div class="row"><span class="dot" style="background:${COLORS[t]||"#888"}"></span>${t}<b>${n.toLocaleString()}</b></div>`).join("");
}

async function tick(){
  const {v,demo:isDemo}=await getViewers();
  people.forEach(p=>p.viewers=v[p.slug]||0);
  draw();
  const live=people.filter(p=>p.viewers).length;
  document.getElementById("status").textContent=(isDemo?"⚠ MODO DEMO (datos falsos) · ":"EN VIVO · ")+live+" streamers en directo · "+new Date().toLocaleTimeString();
}
fetch("/teams.json").then(r=>r.json()).then(d=>{people=d.map(p=>({...p,viewers:0}));tick();setInterval(tick,POLL);});
addEventListener("resize",()=>draw());
</script></body></html>
